# FRM Commercial Dashboard viewer — standalone Next.js (saved weekly reports only).
# Portainer: Git repo → docker-compose.yml → redeploy (single file, no extra yml).
# Local: http://localhost:8092/?year=2026&week=26
#
# Requires frm-ai stack running first (creates network frm_ai_frm-ai-network).
# Calls frm-api as http://backend:8000 on that Docker network (not :18443 nginx).

name: frm_commercial_viewer

services:
  viewer:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: frm-commercial-viewer:latest
    container_name: frm-commercial-viewer
    ports:
      - "8092:8093"
    environment:
      FRM_API_BASE_URL: ${FRM_API_BASE_URL:-http://backend:8000}
      FRM_COMMERCIAL_VIEWER_API_KEY: ${FRM_COMMERCIAL_VIEWER_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - frm-ai-network
    restart: unless-stopped

networks:
  frm-ai-network:
    external: true
    name: ${FRM_AI_NETWORK:-frm_ai_frm-ai-network}
