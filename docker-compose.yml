# FRM Commercial Dashboard viewer — standalone Next.js (saved weekly reports only).
# Portainer: stack from Git repo, rebuild on deploy.
# Local: http://localhost:8092/?year=2026&week=26
#
# Production (same VM as frm-ai): use docker-compose.frm-network.yml and
#   FRM_API_BASE_URL=http://backend:8000
# Do NOT use :18443 here — that is the public nginx HTTPS URL for browsers only.

name: frm_commercial_viewer

services:
  viewer:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: frm-commercial-viewer:latest
    container_name: frm-commercial-viewer
    ports:
      - "8092:8093"
    environment:
      FRM_API_BASE_URL: ${FRM_API_BASE_URL:-http://host.docker.internal:8000}
      FRM_COMMERCIAL_VIEWER_API_KEY: ${FRM_COMMERCIAL_VIEWER_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
